[workspace]
members = ["crates/*", "roanoke_game"]
resolver = "2"

[workspace.dependencies]
# Engine
winit = "0.29"
wgpu = "0.19"
log = "0.4"
env_logger = "0.11"

# Math & Physics
glam = { version = "0.25", features = ["serde"] }  # SIMD Math with serialization
noise = "0.9"        # Base noise library
bytemuck = { version = "1.14", features = ["derive"] }

# Fast dev builds - use for iteration
[profile.dev]
opt-level = 1          # Some optimization, still fast compile
incremental = true

# Dev with optimized deps (fast compile, fast runtime)
[profile.dev.package."*"]
opt-level = 2

# Release builds - balanced speed vs compile time
[profile.release]
opt-level = 3
lto = false            # Disable LTO for faster compile (was "thin")
codegen-units = 16     # Parallel codegen (was 1)
incremental = true

# Max performance release (use --profile release-max)
[profile.release-max]
inherits = "release"
lto = "thin"
codegen-units = 1
