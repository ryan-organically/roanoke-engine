[workspace]
members = ["crates/*", "roanoke_game"]
resolver = "2"

[workspace.dependencies]
# Engine
bevy_ecs = "0.13"
winit = "0.29"
wgpu = "0.19"
log = "0.4"
env_logger = "0.11"

# Math & Physics
glam = { version = "0.25", features = ["serde"] }  # SIMD Math with serialization
noise = "0.9"        # Base noise library
bytemuck = { version = "1.14", features = ["derive"] }

# AI
burn = { version = "0.13", features = ["wgpu", "train"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
